# Security headers for every response nginx itself serves. Kept in one file and `include`d in the server block AND in
# each location that sets its own add_header: nginx drops all inherited add_header lines as soon as a location
# declares any of its own, so without the repeat the app's index.html went out with no CSP/HSTS/framing protection.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# blob: lets the in-browser viewer show a verified file (image, PDF, audio/video) fetched by the app itself.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
