# Front door: TLS 1.3 only, serves the React app and proxies /api to the backend.
# Certificates live in /certs (generated by the tls-init service for demos; mount your own for real use).

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;   # demo port mapping; set to your public https URL in production
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.3;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 25 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's DNS, re-asked every 10 s so a recreated backend is found
        set $backend http://backend:8000;         # (a variable makes nginx resolve at request time; the URI is passed unchanged)
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # uploads run OCR + AI before answering
    }

    # A single-page app's index.html must never be cached - the browser needs it fresh on every deploy to find
    # the current (content-hashed) JS/CSS bundle. Without this, a browser that loaded the app before a rebuild can
    # get stuck showing stale routes/roles indefinitely (e.g. a role added after their last visit renders blank).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;   # filenames are content-hashed
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
